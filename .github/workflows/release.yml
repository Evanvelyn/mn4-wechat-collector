name: Test and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate extension files
        run: npm run validate

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build release archive
        run: npm run package

      - name: Select release notes
        run: |
          notes_path="docs/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes_path" ]; then
            cp "$notes_path" release-notes.md
          else
            printf '完整更新内容请查看 CHANGELOG.md。\n' > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "MN4 WeChat Collector $RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --verify-tag \
              --title "MN4 WeChat Collector $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
